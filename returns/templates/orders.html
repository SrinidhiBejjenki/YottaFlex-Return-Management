<!DOCTYPE html>
<html>
<head>
    <title>ReverseFlow - Orders</title>
</head>
<body>

    <h1>All Orders</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Order Date</th>
            <th>Total Amount</th>
            <th>Status</th>
        </tr>

        {% for order in orders %}
        <tr>
            <td>
            <a href="/orders/{{ order.order_id }}/">
            {{ order.order_id }}
            </a>
            </td>
            <td>{{ order.customer.name }}</td>
            <td>{{ order.order_date }}</td>
            <td>₹{{ order.total_amount }}</td>
            <td>{{ order.status }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No orders found.</td>
        </tr>
        {% endfor %}

    </table>

    <br>
    <a href="/dashboard/">Back to Dashboard</a>

</body>
</html>
